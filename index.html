<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timber &amp; Twine — POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Jost:wght@400;500;600;700&family=Cormorant+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #F6F1E6;
    --cream-2: #EFE7D6;
    --forest: #33452F;
    --forest-dark: #212E1D;
    --rose: #B8677E;
    --rose-dark: #9A4F63;
    --gold: #B99143;
    --walnut: #5B3A29;
    --ink: #2A241E;
    --ink-soft: #6b6053;
    --line: #e2d8c3;
    --white: #FFFDF9;
    --radius: 10px;
    --shadow: 0 2px 10px rgba(42,36,30,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Jost', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;}
  .label{
    font-family:'Cormorant SC', serif;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-weight:600;
    font-size:12.5px;
    color:var(--forest);
  }
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--rose);
    outline-offset:2px;
  }
  input, select{
    font-family:inherit;
    font-size:15px;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--white);
    color:var(--ink);
  }

  .site-header{
    background:var(--forest);
    color:var(--cream);
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:var(--shadow);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-word{
    font-family:'Alex Brush', cursive;
    font-size:34px;
    color:var(--cream);
    line-height:1;
  }
  .brand-tag{
    font-family:'Cormorant SC', serif;
    font-size:10.5px;
    letter-spacing:0.22em;
    color:var(--gold);
    text-transform:uppercase;
    margin-top:2px;
  }
  .wreath{width:34px;height:34px;flex-shrink:0;}

  .app-body{
    display:flex;
    align-items:flex-start;
  }
  .tabs{
    display:flex;
    flex-direction:column;
    gap:2px;
    width:200px;
    flex-shrink:0;
    padding:16px 10px;
    background:var(--forest-dark);
    min-height:calc(100vh - 78px);
  }
  .tab{
    background:transparent;
    border:none;
    border-left:3px solid transparent;
    color:#cfd7cb;
    padding:12px 14px;
    font-size:14px;
    font-weight:500;
    text-align:left;
    border-radius:0 6px 6px 0;
    white-space:nowrap;
  }
  .tab.active{color:var(--white); border-left-color:var(--gold); background:rgba(255,255,255,0.06);}
  .tab.disabled{color:#6f7a6c; cursor:default;}
  .tab:not(.disabled):hover{background:rgba(255,255,255,0.05);}

  main{padding:24px 28px 60px; max-width:1180px; margin:0; flex:1; min-width:0;}

  @media (max-width: 760px){
    .app-body{flex-direction:column;}
    .tabs{
      flex-direction:row;
      width:100%;
      min-height:auto;
      overflow-x:auto;
      padding:0 10px;
    }
    .tab{border-left:none; border-bottom:3px solid transparent; border-radius:0;}
    .tab.active{border-left-color:transparent; border-bottom-color:var(--gold); background:transparent;}
  }

  .layout{display:grid; grid-template-columns: 1.5fr 1fr; gap:22px;}
  @media (max-width: 860px){ .layout{grid-template-columns:1fr;} }

  @media (max-width: 600px){
    .site-header{padding:14px 16px;}
    .brand-word{font-size:26px;}
    .brand-tag{font-size:9px;}
    .wreath{width:28px;height:28px;}
    main{padding:16px 14px 40px;}
    .panel{padding:14px;}
    .catalog-grid{grid-template-columns:repeat(2, 1fr); gap:10px;}
    .product-card{padding:10px;}
    .icon-btn{width:34px; height:34px; font-size:15px;}
    .qty-btn{width:32px; height:32px; font-size:16px;}
    .field-row > div{min-width:100%;}
    input, select{font-size:16px; padding:11px 12px;}
    .btn{padding:13px 18px; font-size:15px;}
    .btn-sm{padding:10px 14px; font-size:13.5px;}
    .cart-line{padding:11px 0;}
    .stat-grid{grid-template-columns:repeat(2, 1fr);}
    .panel-head{flex-wrap:wrap; gap:10px;}
  }

  .panel{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px;
  }
  .panel h2{
    margin:0 0 14px;
    font-family:'Cormorant SC', serif;
    font-weight:600;
    font-size:18px;
    letter-spacing:0.06em;
    color:var(--forest);
    text-transform:uppercase;
    display:flex; align-items:center; gap:10px;
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:14px;
  }
  .panel-head h2{margin:0; flex:none;}
  .panel h2::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .catalog-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:12px;
  }
  .product-card{
    position:relative;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--cream);
    padding:12px;
    text-align:left;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .product-card.clickable:hover{ transform:translateY(-2px); box-shadow:var(--shadow); cursor:pointer; }
  .product-name{font-weight:600; font-size:14.5px; margin-bottom:4px; padding-right:56px;}
  .product-cat{font-size:11.5px; color:var(--ink-soft); margin-bottom:8px;}
  .product-price{font-weight:600; color:var(--rose-dark);}
  .stock-pill{
    display:inline-block;
    margin-top:6px;
    font-size:11px;
    padding:2px 8px;
    border-radius:99px;
    background:var(--cream-2);
    color:var(--ink-soft);
  }
  .stock-pill.low{background:#f6e2d9; color:#9a4a1f;}
  .stock-pill.out{background:#f3dcdc; color:#a03030;}

  .card-actions{
    position:absolute; top:8px; right:8px;
    display:flex; gap:4px;
  }
  .icon-btn{
    width:26px; height:26px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--white);
    font-size:13px;
    display:flex; align-items:center; justify-content:center;
    padding:0;
    flex-shrink:0;
  }
  .icon-btn:hover{background:var(--cream-2);}
  .icon-btn.danger:hover{background:#f3dcdc; border-color:#e0a8a8;}

  .cart-line{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-bottom:1px dashed var(--line);
    gap:8px;
  }
  .cart-line-name{font-size:14px; font-weight:500;}
  .cart-line-sub{font-size:12px; color:var(--ink-soft);}
  .qty-btn{
    width:24px; height:24px; border-radius:6px; border:1px solid var(--line);
    background:var(--white); font-size:14px; line-height:1;
  }
  .cart-empty{color:var(--ink-soft); font-size:14px; padding:14px 0;}
  .totals-row{display:flex; justify-content:space-between; font-size:14px; padding:4px 0;}
  .totals-row.grand{font-size:18px; font-weight:700; color:var(--forest); border-top:1px solid var(--line); margin-top:8px; padding-top:10px;}

  .btn{
    border:none; border-radius:8px; padding:11px 18px;
    font-weight:600; font-size:14.5px;
  }
  .btn-primary{background:var(--rose); color:var(--white);}
  .btn-primary:hover{background:var(--rose-dark);}
  .btn-primary:disabled{background:#d8c8ce; color:#fff; cursor:not-allowed;}
  .btn-outline{background:transparent; border:1px solid var(--forest); color:var(--forest);}
  .btn-outline:hover{background:var(--forest); color:var(--white);}
  .btn-full{width:100%; margin-top:14px;}
  .btn-sm{padding:7px 14px; font-size:13px;}

  .field-row{display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .field-row > div{flex:1; min-width:120px; display:flex; flex-direction:column; gap:4px;}
  .field-row label{font-size:12.5px; color:var(--ink-soft);}
  .calc-result{
    background:var(--cream-2);
    border-radius:8px;
    padding:12px 14px;
    margin:12px 0;
    font-size:14px;
  }
  .calc-result strong{color:var(--forest);}

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    gap:12px;
    margin-top:14px;
  }
  .stat-card{
    background:var(--cream-2);
    border-radius:8px;
    padding:12px 14px;
  }
  .stat-card .stat-label{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em;}
  .stat-card .stat-value{font-size:20px; font-weight:700; color:var(--forest); margin-top:2px;}

  .coming-soon{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .coming-soon .wreath{width:52px;height:52px;margin:0 auto 14px;}

  select{width:100%;}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

/* ---------------------------------------------------------------
   CONFIG
   ------------------------------------------------------------- */
const PROXY_URL = "https://timber-twine-proxy.jengrovdahl.workers.dev";
const LOCATIONS = [
  { name: "Blooming Prairie", rate: 0.07375 },
  { name: "Austin", rate: 0.07875 },
  { name: "Owatonna", rate: 0.07375 },
  { name: "Rochester", rate: 0.08125 },
  { name: "Ellendale", rate: 0.07375 },
  { name: "Brownsdale", rate: 0.07375 },
  { name: "Lansing", rate: 0.07375 },
  { name: "Byron", rate: 0.07375 },
  { name: "Dodge Center", rate: 0.07375 },
  { name: "Kasson", rate: 0.07375 },
  { name: "Mantorville", rate: 0.07375 },
]; // MN Dept. of Revenue combined rates, effective 7/1/2026-9/30/2026

const SEED_PRODUCTS = [
  { id: "p1", name: "Rainbow Frog", category: "Crochet", price: 18, stock: 10 },
  { id: "p2", name: "Forest Dino", category: "Crochet", price: 22, stock: 4 },
  { id: "p3", name: "Raccoon Buddy", category: "Crochet", price: 24, stock: 3 },
  { id: "p4", name: "Succulent Pal", category: "Crochet", price: 16, stock: 6 },
  { id: "p5", name: "Engraved Coaster Set", category: "Wood Décor", price: 28, stock: 8 },
  { id: "p6", name: "Custom Sign — Small", category: "Wood Décor", price: 35, stock: 5 },
];

/* ---------------------------------------------------------------
   Wreath mark
   ------------------------------------------------------------- */
function Wreath({ className }) {
  return (
    <svg className={className || "wreath"} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="42" stroke="#B99143" strokeWidth="1.5"/>
      <g stroke="#B8677E" strokeWidth="2" strokeLinecap="round">
        <path d="M25 68 Q35 58 25 48" />
        <path d="M75 68 Q65 58 75 48" />
      </g>
      <g fill="#B8677E" opacity="0.85">
        <circle cx="24" cy="47" r="4"/>
        <circle cx="76" cy="47" r="4"/>
      </g>
      <g fill="#7C8A63" opacity="0.9">
        <ellipse cx="30" cy="60" rx="5" ry="3" transform="rotate(-30 30 60)"/>
        <ellipse cx="70" cy="60" rx="5" ry="3" transform="rotate(30 70 60)"/>
      </g>
    </svg>
  );
}

function formatMoney(n) {
  return `$${(Number.isFinite(n) ? n : 0).toFixed(2)}`;
}

function parseUtcTimestamp(s) {
  // SQLite's datetime('now') returns "YYYY-MM-DD HH:MM:SS" in UTC with no
  // timezone marker, which JS would otherwise misparse as local time.
  if (!s) return new Date(NaN);
  return new Date(s.replace(" ", "T") + "Z");
}

function todayLocalDateString() {
  // Local (not UTC) today, formatted for an <input type="date"> value.
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const day = String(now.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function localDateInputValue(date) {
  // Same as todayLocalDateString but for an arbitrary Date object.
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function localDateTimeToUtcSqlite(dateStr, timeSourceDate) {
  // Combines a chosen local calendar date ("YYYY-MM-DD") with the
  // time-of-day from timeSourceDate, then converts to the UTC
  // "YYYY-MM-DD HH:MM:SS" format used for the sales.created_at column.
  const [y, m, d] = dateStr.split("-").map(Number);
  const combined = new Date(
    y, m - 1, d,
    timeSourceDate.getHours(), timeSourceDate.getMinutes(), timeSourceDate.getSeconds()
  );
  return combined.toISOString().replace("T", " ").replace(/\.\d{3}Z$/, "");
}

function Header() {
  return (
    <header className="site-header">
      <div className="brand">
        <Wreath />
        <div>
          <div className="brand-word">Timber &amp; Twine</div>
          <div className="brand-tag">Custom Handmade Goods · POS</div>
        </div>
      </div>
    </header>
  );
}

/* ---------------------------------------------------------------
   Area names match Hen House POS so the same person can support
   both apps: POS, Products, Sales. Custom Order is unique to
   Timber & Twine's made-to-order side of the business.
   ------------------------------------------------------------- */
const TABS = [
  { id: "pos", label: "POS" },
  { id: "products", label: "Products" },
  { id: "sales", label: "Sales" },
  { id: "custom", label: "Custom Order" },
  { id: "giftcards", label: "Gift Cards", disabled: true },
  { id: "timekeeping", label: "Time", disabled: true },
  { id: "reports", label: "Reports", disabled: true },
];

function TabBar({ active, onChange }) {
  return (
    <nav className="tabs">
      {TABS.map(t => (
        <button
          key={t.id}
          className={"tab" + (active === t.id ? " active" : "") + (t.disabled ? " disabled" : "")}
          onClick={() => !t.disabled && onChange(t.id)}
          title={t.disabled ? "Coming in a later update" : undefined}
        >
          {t.label}
        </button>
      ))}
    </nav>
  );
}

/* ---------------------------------------------------------------
   ProductGrid — used on the POS page (click to add to cart) and,
   with onEdit/onDelete supplied, on the Products page (management).
   ------------------------------------------------------------- */
function ProductGrid({ products, onAdd, onEdit, onDelete }) {
  return (
    <div className="catalog-grid">
      {products.map(p => {
        const low = p.stock > 0 && p.stock <= 3;
        const out = p.stock <= 0;
        const manageMode = !!(onEdit || onDelete);
        return (
          <div
            key={p.id}
            className={"product-card" + (onAdd && !out ? " clickable" : "")}
            onClick={() => { if (onAdd && !out) onAdd(p); }}
          >
            {manageMode && (
              <div className="card-actions">
                {onEdit && (
                  <button className="icon-btn" title="Edit" onClick={(e) => { e.stopPropagation(); onEdit(p); }}>✎</button>
                )}
                {onDelete && (
                  <button className="icon-btn danger" title="Delete" onClick={(e) => { e.stopPropagation(); onDelete(p); }}>🗑</button>
                )}
              </div>
            )}
            <div className="product-name">{p.name}</div>
            <div className="product-cat">{p.category || "Uncategorized"}</div>
            <div className="product-price">{p.variablePrice ? "Set at checkout" : formatMoney(p.price)}</div>
            <span className={"stock-pill" + (out ? " out" : low ? " low" : "")}>
              {out ? "Out of stock" : `${p.stock} in stock`}
            </span>
          </div>
        );
      })}
    </div>
  );
}

function CartPanel({ cart, onQty, onRemove, onCheckout, checkingOut, location, onLocationChange, paymentMethod, onPaymentMethodChange, onPriceChange, saleDate, onSaleDateChange }) {
  const rate = LOCATIONS.find(l => l.name === location)?.rate ?? LOCATIONS[0].rate;
  const rawSubtotal = cart.reduce((s, l) => s + l.price * l.qty, 0);

  let subtotal, tax, total;
  if (paymentMethod === "cash") {
    total = rawSubtotal;
    subtotal = rawSubtotal / (1 + rate);
    tax = total - subtotal;
  } else {
    subtotal = rawSubtotal;
    tax = rawSubtotal * rate;
    total = rawSubtotal + tax;
  }

  return (
    <div className="panel">
      <h2>Cart</h2>
      {cart.length === 0 && <div className="cart-empty">No items yet — tap a product or add a custom order.</div>}
      {cart.map(line => (
        <div className="cart-line" key={line.key}>
          <div>
            <div className="cart-line-name">{line.name}</div>
            {line.variablePrice ? (
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 4 }}>
                <span className="cart-line-sub">$</span>
                <input
                  type="number"
                  min="0"
                  step="0.5"
                  value={line.price === 0 ? "" : line.price}
                  onChange={e => onPriceChange(line.key, parseFloat(e.target.value))}
                  placeholder="0.00"
                  style={{ width: 90, padding: "5px 8px", fontSize: 13 }}
                />
                <span className="cart-line-sub">each</span>
              </div>
            ) : (
              <div className="cart-line-sub">{formatMoney(line.price)} each</div>
            )}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <button className="qty-btn" onClick={() => onQty(line.key, -1)}>−</button>
            <span>{line.qty}</span>
            <button className="qty-btn" onClick={() => onQty(line.key, 1)}>+</button>
            <button className="qty-btn" onClick={() => onRemove(line.key)} title="Remove">✕</button>
          </div>
        </div>
      ))}

      <div className="field-row" style={{ marginTop: 14 }}>
        <div>
          <label>Location</label>
          <select value={location} onChange={e => onLocationChange(e.target.value)}>
            {LOCATIONS.map(l => (
              <option key={l.name} value={l.name}>{l.name} ({(l.rate*100).toFixed(3)}%)</option>
            ))}
          </select>
        </div>
        <div>
          <label>Payment</label>
          <select value={paymentMethod} onChange={e => onPaymentMethodChange(e.target.value)}>
            <option value="card">Card (tax added)</option>
            <option value="cash">Cash (tax included)</option>
          </select>
        </div>
        <div>
          <label>Sale Date</label>
          <input type="date" value={saleDate} onChange={e => onSaleDateChange(e.target.value)} />
        </div>
      </div>
      {saleDate !== todayLocalDateString() && (
        <div className="cart-line-sub" style={{ marginTop: -6, marginBottom: 10 }}>Recording this sale as {new Date(saleDate + "T00:00:00").toLocaleDateString()} instead of today.</div>
      )}

      <div style={{ marginTop: 12 }}>
        <div className="totals-row"><span>Subtotal</span><span>{formatMoney(subtotal)}</span></div>
        <div className="totals-row"><span>Tax ({location}, {(rate*100).toFixed(3)}%)</span><span>{formatMoney(tax)}</span></div>
        <div className="totals-row grand"><span>Total</span><span>{formatMoney(total)}</span></div>
      </div>
      {paymentMethod === "cash" && (
        <div className="cart-line-sub" style={{ marginTop: 6 }}>Cash sales charge exactly the sticker price — tax is backed out of that total for your records.</div>
      )}
      <button
        className="btn btn-primary btn-full"
        disabled={cart.length === 0 || checkingOut || cart.some(l => l.variablePrice && (!l.price || l.price <= 0))}
        onClick={() => onCheckout(subtotal, tax, total, paymentMethod, location, saleDate)}
      >
        {checkingOut ? "Recording sale…" : "Complete Sale"}
      </button>
    </div>
  );
}

function CustomOrderPanel({ onAddToCart }) {
  const [description, setDescription] = useState("");
  const [hours, setHours] = useState("");
  const [rate, setRate] = useState("15");
  const [override, setOverride] = useState("");

  const calculated = useMemo(() => {
    const h = parseFloat(hours);
    const r = parseFloat(rate);
    if (isNaN(h) || isNaN(r)) return null;
    return h * r;
  }, [hours, rate]);

  const finalPrice = override !== "" ? parseFloat(override) : calculated;

  return (
    <div className="panel">
      <h2>Custom Order Pricing</h2>
      <div className="field-row">
        <div style={{ flex: 2 }}>
          <label>Description</label>
          <input value={description} onChange={e => setDescription(e.target.value)} placeholder="e.g. Custom crochet frog, purple" />
        </div>
      </div>
      <div className="field-row">
        <div>
          <label>Hours spent</label>
          <input type="number" min="0" step="0.25" value={hours} onChange={e => setHours(e.target.value)} placeholder="1.5" />
        </div>
        <div>
          <label>Hourly rate ($)</label>
          <input type="number" min="0" step="0.5" value={rate} onChange={e => setRate(e.target.value)} />
        </div>
      </div>

      {calculated !== null && (
        <div className="calc-result">
          Calculated price: <strong>{formatMoney(calculated)}</strong>
        </div>
      )}

      <div className="field-row">
        <div>
          <label>Override price ($) — optional</label>
          <input type="number" min="0" step="0.5" value={override} onChange={e => setOverride(e.target.value)} placeholder="Leave blank to use calculated price" />
        </div>
      </div>

      <button
        className="btn btn-primary btn-full"
        disabled={!description || finalPrice === null || isNaN(finalPrice)}
        onClick={() => {
          onAddToCart({
            key: `custom-${Date.now()}`,
            id: null,
            name: description,
            price: finalPrice,
            qty: 1,
          });
          setDescription(""); setHours(""); setOverride("");
        }}
      >
        Add to Cart — {finalPrice ? formatMoney(finalPrice) : "—"}
      </button>
    </div>
  );
}

function ComingSoon({ label }) {
  return (
    <div className="panel coming-soon">
      <Wreath />
      <h2 style={{ border: "none" }}>{label}</h2>
      <p>This section is queued for the next build pass, same as the rest of the Hen House feature set.</p>
    </div>
  );
}

/* ---------------------------------------------------------------
   Products page — grid of ManageProductGrid cards with edit/delete
   icons, plus an Add/Edit form. Mirrors Hen House's Product Catalog.
   ------------------------------------------------------------- */
function ProductForm({ initial, onSave, onCancel, saving }) {
  const [name, setName] = useState(initial?.name || "");
  const [category, setCategory] = useState(initial?.category || "");
  const [stock, setStock] = useState(initial?.stock != null ? String(initial.stock) : "0");
  const [price, setPrice] = useState(initial?.price != null ? String(initial.price) : "");
  const [priceMode, setPriceMode] = useState("manual");
  const [hours, setHours] = useState("");
  const [rate, setRate] = useState("15");
  const [variablePrice, setVariablePrice] = useState(initial?.variablePrice || false);

  const calculated = useMemo(() => {
    const h = parseFloat(hours);
    const r = parseFloat(rate);
    if (isNaN(h) || isNaN(r)) return null;
    return h * r;
  }, [hours, rate]);

  const finalPrice = price === "" ? 0 : parseFloat(price);
  const canSave = name.trim().length > 0 && (variablePrice || (!isNaN(finalPrice) && finalPrice >= 0));

  return (
    <div className="panel" style={{ marginTop: 18 }}>
      <h2>{initial ? "Edit Product" : "Add Product"}</h2>
      <div className="field-row">
        <div style={{ flex: 2 }}>
          <label>Name</label>
          <input value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Rainbow Frog" />
        </div>
        <div>
          <label>Category</label>
          <input value={category} onChange={e => setCategory(e.target.value)} placeholder="e.g. Crochet" />
        </div>
      </div>

      <div className="field-row">
        <div style={{ flexDirection: "row", alignItems: "center", gap: 8 }}>
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13.5, color: "var(--ink)" }}>
            <input type="checkbox" checked={variablePrice} onChange={e => setVariablePrice(e.target.checked)} style={{ width: "auto" }} />
            Variable price — set at checkout (e.g. embroidered sweaters)
          </label>
        </div>
      </div>

      <div className="field-row">
        <div>
          <label>Stock</label>
          <input type="number" min="0" step="1" value={stock} onChange={e => setStock(e.target.value)} />
        </div>
        <div style={{ display: variablePrice ? "none" : "flex" }}>
          <label>Price mode</label>
          <select value={priceMode} onChange={e => setPriceMode(e.target.value)}>
            <option value="manual">Type price directly</option>
            <option value="calc">Calculate from hours &times; rate</option>
          </select>
        </div>
      </div>

      {!variablePrice && priceMode === "calc" && (
        <div className="field-row">
          <div>
            <label>Hours spent</label>
            <input type="number" min="0" step="0.25" value={hours} onChange={e => setHours(e.target.value)} placeholder="1.5" />
          </div>
          <div>
            <label>Hourly rate ($)</label>
            <input type="number" min="0" step="0.5" value={rate} onChange={e => setRate(e.target.value)} />
          </div>
        </div>
      )}

      {!variablePrice && priceMode === "calc" && calculated !== null && (
        <div className="calc-result">
          Calculated price: <strong>{formatMoney(calculated)}</strong>
          <button
            className="btn btn-outline btn-sm"
            style={{ marginLeft: 12 }}
            onClick={() => setPrice(calculated.toFixed(2))}
          >
            Use this price
          </button>
        </div>
      )}

      {variablePrice ? (
        <div className="calc-result">This product's price will be entered in the cart at checkout instead of being fixed here.</div>
      ) : (
        <div className="field-row">
          <div>
            <label>Price ($)</label>
            <input type="number" min="0" step="0.5" value={price} onChange={e => setPrice(e.target.value)} placeholder="0.00" />
          </div>
        </div>
      )}

      <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
        <button
          className="btn btn-primary"
          disabled={!canSave || saving}
          onClick={() => onSave({
            id: initial?.id,
            name: name.trim(),
            category: category.trim(),
            stock: parseInt(stock, 10) || 0,
            price: finalPrice,
            variablePrice,
          })}
        >
          {saving ? "Saving…" : initial ? "Save Changes" : "Add Product"}
        </button>
        <button className="btn btn-outline" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

function ProductsPanel({ products, onSave, onDelete, saving, loadError }) {
  const [formOpen, setFormOpen] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const editing = editingId ? products.find(p => p.id === editingId) : null;

  return (
    <div>
      <div className="panel">
        <div className="panel-head">
          <h2>Products</h2>
          <button className="btn btn-primary btn-sm" onClick={() => { setEditingId(null); setFormOpen(true); }}>
            + Add Product
          </button>
        </div>
        {loadError && <div className="cart-line-sub" style={{ marginBottom: 10 }}>Couldn’t load products from the database — {loadError}</div>}
        {products.length === 0 && !loadError && <div className="cart-empty">No products yet — add your first one.</div>}
        <ProductGrid
          products={products}
          onEdit={(p) => { setEditingId(p.id); setFormOpen(true); }}
          onDelete={(p) => onDelete(p)}
        />
      </div>

      {formOpen && (
        <ProductForm
          key={editingId || "new"}
          initial={editing}
          saving={saving}
          onSave={async (data) => { await onSave(data); setFormOpen(false); setEditingId(null); }}
          onCancel={() => { setFormOpen(false); setEditingId(null); }}
        />
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   Sales page — history, summary stats, date filter, edit/delete.
   Mirrors Hen House's Sales History.
   ------------------------------------------------------------- */
function SaleEditForm({ sale, onSave, onCancel, saving }) {
  const [paymentMethod, setPaymentMethod] = useState(sale.paymentMethod || "card");
  const [location, setLocation] = useState(sale.location || LOCATIONS[0].name);
  const [total, setTotal] = useState(String(sale.total));
  const [saleDate, setSaleDate] = useState(localDateInputValue(parseUtcTimestamp(sale.createdAt)));

  return (
    <div className="panel" style={{ marginTop: 18 }}>
      <h2>Edit Sale</h2>
      <div className="field-row">
        <div>
          <label>Location</label>
          <select value={location} onChange={e => setLocation(e.target.value)}>
            {LOCATIONS.map(l => <option key={l.name} value={l.name}>{l.name}</option>)}
          </select>
        </div>
        <div>
          <label>Payment</label>
          <select value={paymentMethod} onChange={e => setPaymentMethod(e.target.value)}>
            <option value="card">Card</option>
            <option value="cash">Cash</option>
          </select>
        </div>
        <div>
          <label>Total ($)</label>
          <input type="number" min="0" step="0.01" value={total} onChange={e => setTotal(e.target.value)} />
        </div>
        <div>
          <label>Sale Date</label>
          <input type="date" value={saleDate} onChange={e => setSaleDate(e.target.value)} />
        </div>
      </div>
      <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
        <button
          className="btn btn-primary"
          disabled={saving}
          onClick={() => onSave({
            id: sale.id,
            subtotal: sale.subtotal,
            tax: sale.tax,
            total: parseFloat(total),
            paymentMethod,
            location,
            createdAt: localDateTimeToUtcSqlite(saleDate, parseUtcTimestamp(sale.createdAt)),
          })}
        >
          {saving ? "Saving…" : "Save Changes"}
        </button>
        <button className="btn btn-outline" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

function SalesPanel() {
  const [sales, setSales] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [from, setFrom] = useState(todayLocalDateString());
  const [to, setTo] = useState(todayLocalDateString());
  const [editingSale, setEditingSale] = useState(null);
  const [saving, setSaving] = useState(false);

  const loadSales = useCallback(async () => {
    setLoading(true);
    setLoadError(null);
    try {
      const params = new URLSearchParams();
      if (from) params.set("fromUtc", new Date(from + "T00:00:00").toISOString().replace("T", " ").replace(/\.\d{3}Z$/, ""));
      if (to) params.set("toUtc", new Date(to + "T23:59:59.999").toISOString().replace("T", " ").replace(/\.\d{3}Z$/, ""));
      const res = await fetch(`${PROXY_URL}/sales?${params.toString()}`);
      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      const data = await res.json();
      setSales(Array.isArray(data.sales) ? data.sales : []);
    } catch (err) {
      console.error(err);
      setLoadError(err.message || "couldn't reach the server");
    } finally {
      setLoading(false);
    }
  }, [from, to]);

  useEffect(() => { loadSales(); }, [loadSales]);

  const deleteSale = async (id) => {
    if (!window.confirm("Delete this sale? This can't be undone.")) return;
    try {
      const res = await fetch(`${PROXY_URL}/sales?id=${encodeURIComponent(id)}`, { method: "DELETE" });
      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      setSales(prev => prev.filter(s => s.id !== id));
    } catch (err) {
      console.error(err);
      alert("Couldn't delete the sale — check the console for details.");
    }
  };

  const saveSaleEdit = async (data) => {
    setSaving(true);
    try {
      const res = await fetch(`${PROXY_URL}/sales`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      setSales(prev => prev.map(s => s.id === data.id ? { ...s, ...data } : s));
      setEditingSale(null);
    } catch (err) {
      console.error(err);
      alert("Couldn't update the sale — check the console for details.");
    } finally {
      setSaving(false);
    }
  };

  const revenue = sales.reduce((s, r) => s + r.total, 0);
  const taxCollected = sales.reduce((s, r) => s + r.tax, 0);
  const txCount = sales.length;
  const avgSale = txCount ? revenue / txCount : 0;

  return (
    <div>
      <div className="panel">
        <h2>Sales History</h2>
        <div className="field-row">
          <div>
            <label>From</label>
            <input type="date" value={from} onChange={e => setFrom(e.target.value)} />
          </div>
          <div>
            <label>To</label>
            <input type="date" value={to} onChange={e => setTo(e.target.value)} />
          </div>
          <div style={{ display: "flex", alignItems: "flex-end" }}>
            <button className="btn btn-outline btn-sm" onClick={() => { setFrom(""); setTo(""); }}>Clear</button>
          </div>
        </div>
        <div className="stat-grid">
          <div className="stat-card"><div className="stat-label">Revenue</div><div className="stat-value">{formatMoney(revenue)}</div></div>
          <div className="stat-card"><div className="stat-label">Tax Collected</div><div className="stat-value">{formatMoney(taxCollected)}</div></div>
          <div className="stat-card"><div className="stat-label">Transactions</div><div className="stat-value">{txCount}</div></div>
          <div className="stat-card"><div className="stat-label">Avg Sale</div><div className="stat-value">{formatMoney(avgSale)}</div></div>
        </div>
      </div>

      <div className="panel" style={{ marginTop: 18 }}>
        {loading && <div className="cart-empty">Loading sales…</div>}
        {loadError && <div className="cart-line-sub">Couldn't load sales — {loadError}</div>}
        {!loading && !loadError && sales.length === 0 && <div className="cart-empty">No sales in this range.</div>}
        {!loading && sales.map(s => (
          <div className="cart-line" key={s.id}>
            <div>
              <div className="cart-line-name">
                {parseUtcTimestamp(s.createdAt).toLocaleDateString()} {parseUtcTimestamp(s.createdAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })} — {(s.items || []).map(i => `${i.description}×${i.quantity}`).join(", ") || "(no items on file)"}
              </div>
              <div className="cart-line-sub">
                {s.location || "—"} · {s.paymentMethod || "—"} · Sub {formatMoney(s.subtotal)} · Tax {formatMoney(s.tax)} · Total {formatMoney(s.total)}
              </div>
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              <button className="icon-btn" title="Edit" onClick={() => setEditingSale(s)}>✎</button>
              <button className="icon-btn danger" title="Delete" onClick={() => deleteSale(s.id)}>🗑</button>
            </div>
          </div>
        ))}
      </div>

      {editingSale && (
        <SaleEditForm sale={editingSale} saving={saving} onSave={saveSaleEdit} onCancel={() => setEditingSale(null)} />
      )}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("pos");
  const [products, setProducts] = useState(SEED_PRODUCTS);
  const [productsLoadError, setProductsLoadError] = useState(null);
  const [savingProduct, setSavingProduct] = useState(false);
  const [ratesStatus, setRatesStatus] = useState(null);
  const [cart, setCart] = useState([]);
  const [checkingOut, setCheckingOut] = useState(false);
  const [lastSale, setLastSale] = useState(null);
  const [location, setLocation] = useState(LOCATIONS[0].name);
  const [paymentMethod, setPaymentMethod] = useState("card");
  const [saleDate, setSaleDate] = useState(todayLocalDateString());

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const res = await fetch(`${PROXY_URL}/products`);
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        if (!cancelled && Array.isArray(data.products)) {
          setProducts(data.products);
        }
      } catch (err) {
        console.error(err);
        if (!cancelled) setProductsLoadError(err.message || "couldn't reach the server");
      }
    })();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const res = await fetch(`${PROXY_URL}/rates-status`);
        if (!res.ok) return;
        const data = await res.json();
        if (!cancelled) setRatesStatus(data);
      } catch (err) {
        console.error(err);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  const saveProduct = useCallback(async (data) => {
    setSavingProduct(true);
    try {
      const res = await fetch(`${PROXY_URL}/products`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.error || `Server returned ${res.status}`);
      }
      const saved = await res.json();
      const savedId = saved.id || data.id;
      setProducts(prev => {
        const exists = prev.some(p => p.id === savedId);
        const updated = { id: savedId, name: data.name, category: data.category, price: data.price, stock: data.stock, trackStock: true };
        return exists ? prev.map(p => p.id === savedId ? updated : p) : [...prev, updated];
      });
    } catch (err) {
      console.error(err);
      alert("Couldn't save the product — check the console for details.");
    } finally {
      setSavingProduct(false);
    }
  }, []);

  const deleteProduct = useCallback(async (p) => {
    if (!window.confirm(`Delete "${p.name}"? This can't be undone.`)) return;
    try {
      const res = await fetch(`${PROXY_URL}/products?id=${encodeURIComponent(p.id)}`, { method: "DELETE" });
      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      setProducts(prev => prev.filter(item => item.id !== p.id));
    } catch (err) {
      console.error(err);
      alert("Couldn't delete the product — check the console for details.");
    }
  }, []);

  const addProduct = useCallback((p) => {
    setCart(prev => {
      const existing = prev.find(l => l.id === p.id);
      if (existing && !p.variablePrice) {
        return prev.map(l => l.id === p.id ? { ...l, qty: l.qty + 1 } : l);
      }
      const key = p.variablePrice ? `${p.id}-${Date.now()}` : p.id;
      return [...prev, { key, id: p.id, name: p.name, price: p.variablePrice ? 0 : p.price, qty: 1, variablePrice: !!p.variablePrice }];
    });
  }, []);

  const changePrice = useCallback((key, price) => {
    setCart(prev => prev.map(l => l.key === key ? { ...l, price: isNaN(price) ? 0 : Math.max(0, price) } : l));
  }, []);

  const addCustom = useCallback((line) => {
    setCart(prev => [...prev, line]);
  }, []);

  const changeQty = useCallback((key, delta) => {
    setCart(prev => prev
      .map(l => l.key === key ? { ...l, qty: l.qty + delta } : l)
      .filter(l => l.qty > 0)
    );
  }, []);

  const removeLine = useCallback((key) => {
    setCart(prev => prev.filter(l => l.key !== key));
  }, []);

  const checkout = useCallback(async (subtotal, tax, total, paymentMethod, location, saleDate) => {
    setCheckingOut(true);
    try {
      const createdAt = localDateTimeToUtcSqlite(saleDate, new Date());
      const res = await fetch(`${PROXY_URL}/sale`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ subtotal, tax, total, paymentMethod, location, items: cart, createdAt }),
      });
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.error || `Proxy returned ${res.status}`);
      }
      setLastSale({ subtotal, tax, total, count: cart.length });
      setCart([]);
      setSaleDate(todayLocalDateString());
    } catch (err) {
      console.error(err);
      alert("Couldn't record the sale — check the console for details.");
    } finally {
      setCheckingOut(false);
    }
  }, [cart]);

  return (
    <React.Fragment>
      <Header />
      {ratesStatus?.possiblyStale && (
        <div style={{ background: "#f6e2d9", color: "#7a4620", padding: "10px 28px", fontSize: 13.5, textAlign: "center" }}>
          Minnesota's sales tax notices page changed{ratesStatus.staleSince ? ` on ${new Date(ratesStatus.staleSince).toLocaleDateString()}` : ""} — worth double-checking the location rates in Checkout are still current.
        </div>
      )}
      <div className="app-body">
        <TabBar active={tab} onChange={setTab} />
        <main>
          {tab === "pos" && (
            <div className="layout">
              <div className="panel">
                <h2>Products</h2>
                <ProductGrid products={products} onAdd={addProduct} />
              </div>
              <CartPanel
                cart={cart}
                onQty={changeQty}
                onRemove={removeLine}
                onCheckout={checkout}
                checkingOut={checkingOut}
                location={location}
                onLocationChange={setLocation}
                paymentMethod={paymentMethod}
                onPaymentMethodChange={setPaymentMethod}
                onPriceChange={changePrice}
                saleDate={saleDate}
                onSaleDateChange={setSaleDate}
              />
            </div>
          )}

          {tab === "custom" && (
            <div className="layout">
              <CustomOrderPanel onAddToCart={addCustom} />
              <CartPanel
                cart={cart}
                onQty={changeQty}
                onRemove={removeLine}
                onCheckout={checkout}
                checkingOut={checkingOut}
                location={location}
                onLocationChange={setLocation}
                paymentMethod={paymentMethod}
                onPaymentMethodChange={setPaymentMethod}
                onPriceChange={changePrice}
                saleDate={saleDate}
                onSaleDateChange={setSaleDate}
              />
            </div>
          )}

          {tab === "products" && (
            <ProductsPanel
              products={products}
              onSave={saveProduct}
              onDelete={deleteProduct}
              saving={savingProduct}
              loadError={productsLoadError}
            />
          )}

          {tab === "sales" && <SalesPanel />}

          {tab === "giftcards" && <ComingSoon label="Gift Cards & Coupons" />}
          {tab === "timekeeping" && <ComingSoon label="Time" />}
          {tab === "reports" && <ComingSoon label="Reports" />}

          {lastSale && (
            <div className="panel" style={{ marginTop: 18 }}>
              <h2>Last Sale</h2>
              <p>{lastSale.count} item(s) — total {formatMoney(lastSale.total)}</p>
            </div>
          )}
        </main>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
